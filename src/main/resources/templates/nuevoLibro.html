<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Nuevo Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/nuevoLibro.css}">

</head>

<body>

<div class="container py-5">

    <div class="form-card">

        <div class="text-center mb-4">

            <div class="icon-circle">
                <i class="fa-solid fa-book"></i>
            </div>

            <h2>Registrar Libro</h2>

            <p class="text-muted">
                Guarda la información del libro
            </p>

        </div>

        <form
                th:action="@{/libros}"
                th:object="${libro}"
                method="post">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label>ISBN</label>

                    <input
                            type="text"
                            class="form-control"
                            th:field="*{isbn}">

                </div>

                <div class="col-md-6 mb-4">

                    <label>Título</label>

                    <input
                            type="text"
                            class="form-control"
                            th:field="*{titulo}">

                </div>

                <div class="col-md-6 mb-4">

                    <label>Autor</label>

                    <input
                            type="text"
                            class="form-control"
                            th:field="*{autor}">

                </div>

                <div class="col-md-6 mb-4">

                    <label>Categoría</label>

                    <input
                            type="text"
                            class="form-control"
                            th:field="*{categoria}">

                </div>

                <div class="col-md-4 mb-4">

                    <label>Año</label>

                    <input
                            type="number"
                            class="form-control"
                            th:field="*{anio}">

                </div>

                <div class="col-md-4 mb-4">

                    <label>Cantidad</label>

                    <input
                            type="number"
                            class="form-control"
                            th:field="*{cantidad}">

                </div>

                <div class="col-md-4 mb-4">

                    <label>Disponibles</label>

                    <input
                            type="number"
                            class="form-control"
                            th:field="*{disponibles}">

                </div>

            </div>

            <div class="botones">

                <button class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Guardar Libro

                </button>

                <a th:href="@{/libros}" class="btn btn-cancelar">

                    <i class="fa-solid fa-arrow-left"></i>

                    Volver

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
