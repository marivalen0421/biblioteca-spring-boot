<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Detalle del Préstamo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/detallePrestamo.css}">

</head>

<body>

<div class="container py-5">

    <div class="detail-card">

        <div class="detail-header">

            <i class="fa-solid fa-file-lines"></i>

            <h2>Detalle del Préstamo</h2>

            <p>Información completa del préstamo realizado.</p>

        </div>

        <table class="table">

            <tbody>

            <tr>
                <th><i class="fa-solid fa-hashtag"></i> ID</th>
                <td th:text="${prestamo.id}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-user-graduate"></i> Estudiante</th>
                <td th:text="${prestamo.estudiante.nombre}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-id-card"></i> Documento</th>
                <td th:text="${prestamo.estudiante.documento}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-book"></i> Libro</th>
                <td th:text="${prestamo.libro.titulo}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-barcode"></i> ISBN</th>
                <td th:text="${prestamo.libro.isbn}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-pen"></i> Autor</th>
                <td th:text="${prestamo.libro.autor}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-calendar-days"></i> Fecha préstamo</th>
                <td th:text="${prestamo.fechaPrestamo}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-calendar-check"></i> Fecha límite</th>
                <td th:text="${prestamo.fechaDevolucion}"></td>
            </tr>

            <tr>
                <th><i class="fa-solid fa-calendar-plus"></i> Fecha devolución</th>

                <td th:text="${prestamo.fecha != null ? prestamo.fecha : 'Aún no ha sido devuelto'}"></td>

            </tr>

            <tr>

                <th><i class="fa-solid fa-circle-info"></i> Estado</th>

                <td>

                    <span class="badge estado-devuelto"
                          th:if="${prestamo.estado=='Devuelto'}">
                        Devuelto
                    </span>

                    <span class="badge estado-prestado"
                          th:if="${prestamo.estado=='Prestado'}">
                        Prestado
                    </span>

                </td>

            </tr>

            <tr th:if="${prestamo.fecha != null}">

                <th><i class="fa-solid fa-clock"></i> Entrega</th>

                <td>

                    <span class="badge entrega-ok"
                          th:if="${!prestamo.fecha.isAfter(prestamo.fechaDevolucion)}">

                        Devuelto a tiempo

                    </span>

                    <span class="badge entrega-late"
                          th:if="${prestamo.fecha.isAfter(prestamo.fechaDevolucion)}">

                        Devuelto con retraso

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="text-center mt-4">

            <a th:href="@{/prestamos}" class="btn btn-back">

                <i class="fa-solid fa-arrow-left"></i>

                Volver

            </a>

        </div>

    </div>

</div>

</body>

</html>
