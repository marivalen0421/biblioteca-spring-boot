<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <link rel="stylesheet" th:href="@{/css/prestamos.css}">

</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="main-content">

        <div th:replace="fragments/navbar :: navbar"></div>

        <div class="page-header">

            <div>

                <h2>
                    <i class="fa-solid fa-users"></i>
                    Gestión de Usuarios
                </h2>

                <p>Administra las cuentas del sistema.</p>

            </div>

        </div>

        <div class="table-card">

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <table class="table align-middle">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.id}"></td>

                    <td th:text="${usuario.nombre}"></td>

                    <td th:text="${usuario.correo}"></td>

                    <td>

                        <span class="badge bg-primary"
                              th:text="${usuario.rol}">
                        </span>

                    </td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${usuario.activo}">
                            Activo
                        </span>

                        <span class="badge bg-danger"
                              th:unless="${usuario.activo}">
                            Inactivo
                        </span>

                    </td>
                    <td>

                        <form th:action="@{/usuarios/password/{id}(id=${usuario.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-warning btn-sm" title="Restablecer contraseña" onclick="return confirm('¿Restablecer la contraseña de este usuario?')"><i class="fa-solid fa-key"></i></button>
                        </form>
                        <form th:action="@{/usuarios/rol/{id}(id=${usuario.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-primary btn-sm" title="Cambiar rol" onclick="return confirm('¿Cambiar el rol de este usuario?')"><i class="fa-solid fa-user-gear"></i></button>
                        </form>
                        <form th:action="@{/usuarios/estado/{id}(id=${usuario.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" th:classappend="${usuario.activo} ? ' btn-danger' : ' btn-success'" class="btn btn-sm" th:title="${usuario.activo} ? 'Desactivar usuario' : 'Activar usuario'" onclick="return confirm('¿Desea cambiar el estado de este usuario?')"><i th:class="${usuario.activo} ? 'fa-solid fa-user-slash' : 'fa-solid fa-user-check'"></i></button>
                        </form>

                    </td>



                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
