<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Libros | Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/libros.css}">

</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="main-content">

        <div th:replace="fragments/navbar :: navbar"></div>

        <div class="page-header">

            <div>
                <h2>Gestión de Libros</h2>
                <p>Administra todo el catálogo de la biblioteca.</p>
            </div>

            <a th:href="@{/libros/nuevo}" class="btn btn-add">
                <i class="fa-solid fa-plus"></i>
                Nuevo Libro
            </a>

        </div>


        <div class="search-card">

            <form th:action="@{/libros/buscar}" method="get">

                <div class="row g-3">

                    <div class="col-md-9">

                        <input
                                type="text"
                                name="titulo"
                                class="form-control search-input"
                                placeholder="Buscar libro por título...">

                    </div>

                    <div class="col-md-3 d-flex gap-2">

                        <button class="btn btn-search w-100">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            Buscar

                        </button>

                        <a th:href="@{/libros}" class="btn btn-show">

                            <i class="fa-solid fa-rotate-right"></i>

                        </a>

                    </div>

                </div>

            </form>

        </div>


        <div class="table-card">

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <table class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>ISBN</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoría</th>
                    <th>Disponibles</th>
                    <th class="text-center">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="libro : ${libros}">

                    <td th:text="${libro.id}"></td>

                    <td>
                        <span class="isbn"
                              th:text="${libro.isbn}">
                        </span>
                    </td>

                    <td class="fw-bold"
                        th:text="${libro.titulo}">
                    </td>

                    <td th:text="${libro.autor}"></td>

                    <td>

                        <span class="badge categoria"
                              th:text="${libro.categoria}">
                        </span>

                    </td>

                    <td>

                        <span class="badge disponible"
                              th:text="${libro.disponibles}">
                        </span>

                    </td>

                    <td class="text-center">

                        <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                           class="btn btn-edit btn-sm">

                            <i class="fa-solid fa-pen"></i>

                        </a>

                        <form th:action="@{/libros/eliminar/{id}(id=${libro.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-delete btn-sm" onclick="return confirm('¿Desea eliminar este libro?')"><i class="fa-solid fa-trash"></i></button>
                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
