<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/nuevoLibro.css}">

</head>

<body>

<div class="container">

    <div class="form-card">

        <div class="icono">

            <i class="fa-solid fa-book-open"></i>

        </div>

        <h2>Editar Libro</h2>

        <p class="subtitulo">
            Modifica la información del libro.
        </p>

        <form th:action="@{/libros/editar/{id}(id=${libro.id})}"
              th:object="${libro}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>ISBN</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{isbn}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Título</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{titulo}">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Autor</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{autor}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Categoría</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{categoria}">

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label>Año</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{anio}">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Cantidad</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{cantidad}">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Disponibles</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{disponibles}">

                </div>

            </div>

            <div class="botones">

                <button class="btn btn-guardar">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Actualizar Libro

                </button>

                <a th:href="@{/libros}" class="btn btn-cancelar">

                    <i class="fa-solid fa-arrow-left"></i>

                    Volver

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
