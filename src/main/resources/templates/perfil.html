<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Mi perfil</h1>
            <p class="text-muted mb-0">Actualiza tus datos y administra tu contraseña.</p>
        </div>
        <div class="d-flex gap-2">
            <a th:if="${usuario.rol.name() == 'ADMIN'}" th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
            <a th:unless="${usuario.rol.name() == 'ADMIN'}" th:href="@{/catalogo}" class="btn btn-outline-secondary">Volver</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
            </form>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${usuario.passwordTemporal}" class="alert alert-warning">
        <strong>Debes cambiar tu contraseña.</strong>
        Tu contraseña actual es temporal; crea una nueva antes de continuar usando el sistema.
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
            <h2 class="h5 mb-3"><i class="fa-solid fa-user-pen me-2"></i>Datos personales</h2>
            <form th:action="@{/perfil/datos}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nombre">Nombre completo</label>
                        <input id="nombre" name="nombre" type="text" class="form-control" required maxlength="120" th:value="${usuario.nombre}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="correo">Correo electrónico</label>
                        <input id="correo" name="correo" type="email" class="form-control" required maxlength="150" th:value="${usuario.correo}">
                    </div>
                    <div class="col-md-8" th:if="${estudiante != null}">
                        <label class="form-label" for="programa">Programa académico</label>
                        <input id="programa" name="programa" type="text" class="form-control" required maxlength="120" th:value="${estudiante.programa}">
                    </div>
                    <div class="col-md-4" th:if="${estudiante != null}">
                        <label class="form-label" for="semestre">Semestre</label>
                        <input id="semestre" name="semestre" type="number" class="form-control" required min="1" max="20" th:value="${estudiante.semestre}">
                    </div>
                </div>
                <button class="btn btn-primary mt-4" type="submit">Guardar cambios</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="h5 mb-3"><i class="fa-solid fa-key me-2"></i>Cambiar contraseña</h2>
            <div th:if="${passwordSuccess}" class="alert alert-success" th:text="${passwordSuccess}"></div>
            <div th:if="${passwordError}" class="alert alert-danger" th:text="${passwordError}"></div>
            <form th:action="@{/perfil/password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="passwordActual">Contraseña actual</label>
                        <input id="passwordActual" name="passwordActual" type="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="passwordNueva">Nueva contraseña</label>
                        <input id="passwordNueva" name="passwordNueva" type="password" class="form-control" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="confirmarPassword">Confirmar contraseña</label>
                        <input id="confirmarPassword" name="confirmarPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password">
                    </div>
                </div>
                <button class="btn btn-dark mt-4" type="submit">Cambiar contraseña</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
