<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestión de Préstamos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/prestamos.css}">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- Contenido -->
    <main class="main-content">

        <!-- Navbar -->
        <div th:replace="fragments/navbar :: navbar"></div>

        <div class="container-fluid py-4">

            <div class="page-header">

                <div>

                    <h2>
                        <i class="fa-solid fa-handshake"></i>
                        Gestión de Préstamos
                    </h2>

                    <p>
                        Administra los préstamos realizados en la biblioteca.
                    </p>

                </div>

                <div class="d-flex gap-2">

                    <a th:href="@{/prestamos/nuevo}" class="btn btn-add">

                        <i class="fa-solid fa-plus"></i>

                        Nuevo préstamo

                    </a>

                    <a th:href="@{/prestamos/vencidos}" class="btn btn-show">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        Vencidos

                    </a>

                </div>

            </div>

            <div class="table-card">

                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <table class="table align-middle">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Libro</th>
                        <th>Préstamo</th>
                        <th>Devolución</th>
                        <th>Estado</th>
                        <th style="width:220px;">Acciones</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="prestamo : ${prestamos}">

                        <td>
                            <strong>#<span th:text="${prestamo.id}"></span></strong>
                        </td>

                        <td th:text="${prestamo.estudiante.nombre}"></td>

                        <td th:text="${prestamo.libro.titulo}"></td>

                        <td th:text="${prestamo.fechaPrestamo}"></td>

                        <td th:text="${prestamo.fechaDevolucion}"></td>

                        <td>

                            <span class="estado-prestado"
                                  th:if="${prestamo.estado=='Prestado'}">
                                Prestado
                            </span>

                            <span class="estado-devuelto"
                                  th:if="${prestamo.estado=='Devuelto'}">
                                Devuelto
                            </span>

                        </td>

                        <td>

                            <form th:if="${prestamo.estado=='Prestado'}" th:action="@{/prestamos/devolver/{id}(id=${prestamo.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-primary btn-sm" onclick="return confirm('¿Marcar este préstamo como devuelto?')"><i class="fa-solid fa-rotate-left"></i></button>
                            </form>
                            <form th:if="${prestamo.estado=='Devuelto'}" th:action="@{/prestamos/eliminar/{id}(id=${prestamo.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-delete btn-sm" onclick="return confirm('¿Eliminar este préstamo?')"><i class="fa-solid fa-trash"></i></button>
                            </form>

                            <a th:href="@{/prestamos/detalle/{id}(id=${prestamo.id})}"
                               class="btn btn-info btn-sm text-white">

                                <i class="fa-solid fa-eye"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>

</html>
