<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registrar Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/nuevoEstudiante.css}">

</head>

<body>

<div class="container contact-form">

    <div class="contact-image">

        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176151.png"
             alt="Estudiante">

    </div>

    <form th:action="@{/estudiantes}"
          th:object="${estudiantes}"
          method="post">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <h3>
            <i class="fa-solid fa-user-plus"></i>
            Registrar Estudiante
        </h3>

        <div class="mb-3">

            <label>Nombre completo</label>

            <input type="text"
                   class="form-control"
                   th:field="*{nombre}"
                   placeholder="Ingrese el nombre">

        </div>

        <div class="mb-3">

            <label>Documento</label>

            <input type="text"
                   class="form-control"
                   th:field="*{documento}"
                   placeholder="Número de documento">

        </div>

        <div class="mb-3">

            <label>Correo electrónico</label>

            <input type="email"
                   class="form-control"
                   th:field="*{correo}"
                   placeholder="correo@ejemplo.com">

        </div>

        <div class="mb-3">

            <label>Programa académico</label>

            <input type="text"
                   class="form-control"
                   th:field="*{programa}"
                   placeholder="Ingeniería de Software">

        </div>

        <div class="mb-4">

            <label>Semestre</label>

            <input type="number"
                   class="form-control"
                   th:field="*{semestre}"
                   placeholder="Ej: 5">

        </div>
        <div class="alert alert-info d-flex align-items-start mt-4">

            <i class="fa-solid fa-circle-info me-2 mt-1"></i>

            <div>

                <strong>Información del acceso</strong>

                <br>

                Al registrar el estudiante se creará automáticamente una cuenta para iniciar sesión.

                <br>

                <strong>Usuario:</strong> Correo electrónico.

                <br>

                <strong>Contraseña inicial:</strong> Número de documento.

            </div>

        </div>

        <div class="d-flex gap-2">

            <button type="submit" class="btn btn-success">

                <i class="fa-solid fa-floppy-disk"></i>

                Guardar

            </button>

            <a th:href="@{/estudiantes}"
               class="btn btn-secondary">

                <i class="fa-solid fa-arrow-left"></i>

                Cancelar

            </a>

        </div>

    </form>

</div>

</body>

</html>
