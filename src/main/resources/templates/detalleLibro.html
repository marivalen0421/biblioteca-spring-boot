<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalle del Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/detalleLibro.css}">

</head>

<body>

<div class="container py-5">

    <div class="book-detail">

        <div class="row align-items-center">

            <div class="col-lg-4 text-center">

                <div class="book-cover">

                    <img th:src="@{'/uploads/' + ${libro.portada}}" class="img-fluid rounded">

                </div>

            </div>

            <div class="col-lg-8">

                <h2 th:text="${libro.titulo}"></h2>

                <hr>

                <div class="row">

                    <div class="col-md-6 info-item">

                        <i class="fa-solid fa-user-pen"></i>

                        <strong>Autor:</strong>

                        <span th:text="${libro.autor}"></span>

                    </div>

                    <div class="col-md-6 info-item">

                        <i class="fa-solid fa-barcode"></i>

                        <strong>ISBN:</strong>

                        <span th:text="${libro.isbn}"></span>

                    </div>

                    <div class="col-md-6 info-item">

                        <i class="fa-solid fa-layer-group"></i>

                        <strong>Categoría:</strong>

                        <span th:text="${libro.categoria}"></span>

                    </div>

                    <div class="col-md-6 info-item">

                        <i class="fa-solid fa-calendar"></i>

                        <strong>Año:</strong>

                        <span th:text="${libro.anio}"></span>

                    </div>

                    <div class="col-md-6 info-item">

                        <i class="fa-solid fa-boxes-stacked"></i>

                        <strong>Disponibles:</strong>

                        <span th:text="${libro.disponibles}"></span>

                    </div>

                    <div class="col-md-6 info-item">

                        <i class="fa-solid fa-circle-check"></i>

                        <strong>Estado:</strong>

                        <span class="badge bg-success"
                              th:if="${libro.disponibles > 0}">
                            Disponible
                        </span>

                        <span class="badge bg-danger"
                              th:if="${libro.disponibles == 0}">
                            Agotado
                        </span>

                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">

                    <a th:href="@{/catalogoL}"
                       class="btn btn-secondary">

                        <i class="fa-solid fa-arrow-left"></i>

                        Volver

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
