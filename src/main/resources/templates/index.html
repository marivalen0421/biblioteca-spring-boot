<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- Contenido -->
    <main class="main-content">

        <!-- Navbar -->
        <div th:replace="fragments/navbar :: navbar"></div>

        <!-- Tarjetas -->
        <section class="cards">

            <div class="card-dashboard">

                <div>
                    <h5>Libros</h5>
                    <h2 th:text="${totalLibros}"></h2>
                </div>

                <i class="fa-solid fa-book"></i>

            </div>

            <div class="card-dashboard">

                <div>
                    <h5>Estudiantes</h5>
                    <h2 th:text="${totalEstudiantes}"></h2>
                </div>

                <i class="fa-solid fa-user-graduate"></i>

            </div>

            <div class="card-dashboard">

                <div>
                    <h5>Préstamos</h5>
                    <h2 th:text="${totalPrestamos}"></h2>
                </div>

                <i class="fa-solid fa-handshake"></i>

            </div>

            <div class="card-dashboard">

                <div>
                    <h5>Vencidos</h5>
                    <h2 th:text="${prestamosVencidos}"></h2>
                </div>

                <i class="fa-solid fa-triangle-exclamation"></i>

            </div>

        </section>

        <!-- Gráficos -->
        <section class="charts">

            <div class="chart-box">

                <h4>Estado de Libros</h4>

                <div class="chart-container">

                    <canvas id="graficoLibros"></canvas>

                </div>

            </div>

            <div class="chart-box">

                <h4>Préstamos</h4>

                <div class="chart-container">

                    <canvas id="graficoPrestamos"></canvas>

                </div>

            </div>

        </section>

        <!-- Últimos movimientos -->
        <section class="recent">

            <div class="recent-card">

                <h3>Últimos movimientos</h3>

                <table class="table table-hover align-middle">

                    <thead>

                    <tr>

                        <th>Libro</th>
                        <th>Estudiante</th>
                        <th>Fecha</th>
                        <th>Estado</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="prestamo : ${ultimosPrestamos}">

                        <td th:text="${prestamo.libro.titulo}"></td>

                        <td th:text="${prestamo.estudiante.nombre}"></td>

                        <td th:text="${prestamo.fechaPrestamo}"></td>

                        <td>

                            <span
                                    class="badge bg-success"
                                    th:if="${prestamo.estado=='Devuelto'}">

                                Devuelto

                            </span>

                            <span
                                    class="badge bg-warning text-dark"
                                    th:if="${prestamo.estado=='Prestado'}">

                                Prestado

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <!-- Footer -->
        <div th:replace="fragments/footer :: footer"></div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">

    const disponibles = [[${librosDisponibles}]];
    const prestados = [[${librosPrestados}]];

    const prestamosActivos = [[${prestados}]];
    const prestamosDevueltos = [[${devueltos}]];

</script>

<script th:src="@{/js/dashboard.js}"></script>

</body>

</html>
