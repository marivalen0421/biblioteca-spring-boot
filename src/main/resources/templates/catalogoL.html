<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Catálogo de Libros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/catalogo.css}">

</head>

<body>

<div class="container py-5">

    <div class="header-card">

        <h2>

            <i class="fa-solid fa-book-open-reader"></i>

            Catálogo de Libros

        </h2>

        <p>
            Consulta todos los libros disponibles en la biblioteca.
        </p>

    </div>

    <div class="search-box">

        <input type="text"
               class="form-control"
               id="buscarLibro"
               placeholder="Buscar por título, autor o categoría...">

    </div>

    <div class="row mt-4" id="contenedorLibros">

        <div class="col-lg-4 col-md-6 mb-4"
             th:each="libro : ${libros}">

            <div class="book-card h-100">

                <div class="book-icon">

                    <i class="fa-solid fa-book"></i>

                </div>

                <h4 class="titulo"
                    th:text="${libro.titulo}">
                </h4>

                <p>

                    <i class="fa-solid fa-user-pen"></i>

                    <span th:text="${libro.autor}"></span>

                </p>

                <p>

                    <i class="fa-solid fa-barcode"></i>

                    <span th:text="${libro.isbn}"></span>

                </p>

                <p>

                    <i class="fa-solid fa-layer-group"></i>

                    <span th:text="${libro.categoria}"></span>

                </p>

                <p>

                    <i class="fa-solid fa-boxes-stacked"></i>

                    Disponibles:
                    <strong th:text="${libro.disponibles}"></strong>

                </p>

                <div class="mb-3">

                    <span class="badge bg-success"
                          th:if="${libro.disponibles>0}">
                        Disponible
                    </span>

                    <span class="badge bg-danger"
                          th:if="${libro.disponibles==0}">
                        Agotado
                    </span>

                </div>

                <a th:href="@{/catalogoL/detalle/{id}(id=${libro.id})}"
                   class="btn btn-detalle">

                    <i class="fa-solid fa-eye"></i>

                    Ver detalles

                </a>

            </div>

        </div>

    </div>

</div>

<script>

    const buscador=document.getElementById("buscarLibro");

    buscador.addEventListener("keyup",function(){

    const texto=this.value.toLowerCase();

    document.querySelectorAll(".book-card").forEach(card=>{

    const contenido=card.innerText.toLowerCase();

    card.parentElement.style.display=
    contenido.includes(texto)?"block":"none";

    });

    });

</script>

</body>

</html>
