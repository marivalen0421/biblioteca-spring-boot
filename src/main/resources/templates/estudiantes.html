<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Estudiantes | Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/estudiantes.css}">

</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="main-content">

        <div th:replace="fragments/navbar :: navbar"></div>

        <div class="page-header">

            <div>

                <h2>Gestión de Estudiantes</h2>

                <p>Administra los estudiantes registrados.</p>

            </div>

            <a th:href="@{/estudiantes/nuevo}" class="btn btn-add">

                <i class="fa-solid fa-user-plus"></i>

                Registrar Estudiante

            </a>

        </div>


        <div class="search-card">

            <form th:action="@{/estudiantes/buscar}" method="get">

                <div class="row g-3">

                    <div class="col-md-9">

                        <input
                                type="text"
                                name="nombre"
                                class="form-control search-input"
                                placeholder="Buscar estudiante...">

                    </div>

                    <div class="col-md-3 d-flex gap-2">

                        <button class="btn btn-search w-100">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            Buscar

                        </button>

                        <a th:href="@{/estudiantes}" class="btn btn-show">

                            <i class="fa-solid fa-rotate-right"></i>

                        </a>

                    </div>

                </div>

            </form>

        </div>


        <div class="table-card">
            <div th:if="${success}" class="alert alert-success">

                <i class="fa-solid fa-circle-check"></i>

                <span th:text="${success}"></span>

            </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <table class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Documento</th>
                    <th>Correo</th>
                    <th>Programa</th>
                    <th>Semestre</th>
                    <th class="text-center">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="estudiante : ${estudiantes}">

                    <td th:text="${estudiante.id}"></td>

                    <td class="fw-bold" th:text="${estudiante.nombre}"></td>

                    <td>

                        <span class="documento"
                              th:text="${estudiante.documento}">
                        </span>

                    </td>

                    <td th:text="${estudiante.correo}"></td>

                    <td>

                        <span class="badge programa"
                              th:text="${estudiante.programa}">
                        </span>

                    </td>

                    <td>

                        <span class="badge semestre"
                              th:text="${estudiante.semestre}">
                        </span>

                    </td>

                    <td class="text-center">

                        <a th:href="@{/estudiantes/editar/{id}(id=${estudiante.id})}"
                           class="btn btn-edit btn-sm">

                            <i class="fa-solid fa-pen"></i>

                        </a>

                        <form th:action="@{/estudiantes/eliminar/{id}(id=${estudiante.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-delete btn-sm" onclick="return confirm('¿Eliminar este estudiante?')"><i class="fa-solid fa-trash"></i></button>
                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
