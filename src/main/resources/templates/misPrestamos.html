<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mis Préstamos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/misPrestamos.css}">

</head>

<body>

<div class="container py-5">

    <div class="header-card">

        <h2>

            <i class="fa-solid fa-book"></i>

            Mis Préstamos

        </h2>

        <p>

            Bienvenido

            <strong th:text="${usuario.nombre}"></strong>

        </p>

    </div>

    <div class="row">

        <div class="col-lg-4 col-md-6 mb-4"
             th:each="prestamo : ${prestamos}">

            <div class="loan-card">

                <div class="loan-icon">

                    <i class="fa-solid fa-book-open"></i>

                </div>

                <h4 th:text="${prestamo.libro.titulo}"></h4>

                <p>

                    <i class="fa-solid fa-user-pen"></i>

                    <span th:text="${prestamo.libro.autor}"></span>

                </p>

                <p>

                    <i class="fa-solid fa-calendar-days"></i>

                    Prestado:

                    <span th:text="${prestamo.fechaPrestamo}"></span>

                </p>

                <p>

                    <i class="fa-solid fa-clock"></i>

                    Devolver:

                    <span th:text="${prestamo.fechaDevolucion}"></span>

                </p>

                <div class="mb-3">

                    <span class="badge bg-success"
                          th:if="${prestamo.estado=='Prestado'}">

                        Prestado

                    </span>

                    <span class="badge bg-secondary"
                          th:if="${prestamo.estado=='Devuelto'}">

                        Devuelto

                    </span>

                </div>

                <a th:href="@{/mis-prestamos/detalle/{id}(id=${prestamo.id})}"
                   class="btn btn-card">

                    <i class="fa-solid fa-eye"></i>

                    Ver detalle

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
