<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalle del Préstamo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/detallePrestamoEstudiante.css}">


</head>

<body>

<div class="container py-5">

    <div class="detail-card">

        <div class="row">

            <div class="col-lg-4 text-center">

                <div class="book-icon">

                    <i class="fa-solid fa-book-open"></i>

                </div>

            </div>

            <div class="col-lg-8">

                <h2 th:text="${prestamo.libro.titulo}"></h2>

                <hr>

                <div class="info">

                    <p>

                        <i class="fa-solid fa-user-pen"></i>

                        <strong>Autor:</strong>

                        <span th:text="${prestamo.libro.autor}"></span>

                    </p>

                    <p>

                        <i class="fa-solid fa-barcode"></i>

                        <strong>ISBN:</strong>

                        <span th:text="${prestamo.libro.isbn}"></span>

                    </p>

                    <p>

                        <i class="fa-solid fa-calendar-days"></i>

                        <strong>Fecha préstamo:</strong>

                        <span th:text="${prestamo.fechaPrestamo}"></span>

                    </p>

                    <p>

                        <i class="fa-solid fa-clock"></i>

                        <strong>Fecha devolución:</strong>

                        <span th:text="${prestamo.fechaDevolucion}"></span>

                    </p>

                    <p>

                        <i class="fa-solid fa-circle-check"></i>

                        <strong>Estado:</strong>

                        <span class="badge bg-success"
                              th:if="${prestamo.estado=='Prestado'}">

                            Prestado

                        </span>

                        <span class="badge bg-secondary"
                              th:if="${prestamo.estado=='Devuelto'}">

                            Devuelto

                        </span>

                    </p>

                </div>

                <div class="mt-4">

                    <a th:href="@{/mis-prestamos}"
                       class="btn btn-secondary">

                        <i class="fa-solid fa-arrow-left"></i>

                        Volver

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
