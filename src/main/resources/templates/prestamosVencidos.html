<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Préstamos Vencidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/prestamosVencidos.css}">

</head>

<body>

<div class="container py-5">

    <div class="page-header">

        <div>

            <h2>
                <i class="fa-solid fa-triangle-exclamation"></i>
                Préstamos Vencidos
            </h2>

            <p>Los préstamos que aparecen aquí requieren devolución inmediata.</p>

        </div>

        <a th:href="@{/prestamos}" class="btn btn-back">

            <i class="fa-solid fa-arrow-left"></i>

            Volver

        </a>

    </div>

    <div class="table-card">

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <table class="table align-middle">

            <thead>

            <tr>

                <th>ID</th>
                <th>Estudiante</th>
                <th>Libro</th>
                <th>Préstamo</th>
                <th>Vencimiento</th>
                <th>Retraso</th>
                <th>Estado</th>
                <th>Acciones</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="prestamo : ${prestamos}">

                <td>
                    <strong>#<span th:text="${prestamo.id}"></span></strong>
                </td>

                <td th:text="${prestamo.estudiante.nombre}"></td>

                <td th:text="${prestamo.libro.titulo}"></td>

                <td th:text="${prestamo.fechaPrestamo}"></td>

                <td th:text="${prestamo.fechaDevolucion}"></td>

                <td>

                    <span class="badge-delay"
                          th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(prestamo.fechaDevolucion,T(java.time.LocalDate).now()) + ' días'}">
                    </span>

                </td>

                <td>

                    <span class="badge-warning">
                        Prestado
                    </span>

                </td>

                <td>

                    <form th:action="@{/prestamos/devolver/{id}(id=${prestamo.id})}"
                          method="post"
                          onsubmit="return confirm('¿Marcar como devuelto?')">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button type="submit"
                                class="btn btn-success btn-sm">

                            <i class="fa-solid fa-check"></i>

                        </button>

                    </form>

                    <form th:action="@{/prestamos/vencidos/{id}/notificar(id=${prestamo.id})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('¿Notificar al estudiante sobre su retraso?')">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-warning btn-sm" title="Notificar retraso">
                            <i class="fa-solid fa-bell"></i>
                        </button>
                    </form>

                    <a th:href="@{/prestamos/detalle/{id}(id=${prestamo.id})}"
                       class="btn btn-info btn-sm">

                        <i class="fa-solid fa-eye"></i>

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
