<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 680px;">
    <section class="card shadow-sm border-0 text-center">
        <div class="card-body p-5">
            <div class="display-5 mb-3">⚠️</div>
            <h1 class="h3" th:text="${titulo ?: 'Ocurrió un problema'}">Ocurrió un problema</h1>
            <p class="text-muted mt-3" th:text="${mensaje ?: 'La página solicitada no está disponible.'}">
                La página solicitada no está disponible.
            </p>
            <a href="javascript:history.back()" class="btn btn-outline-secondary me-2">Volver</a>
            <a th:href="@{/}" class="btn btn-primary">Ir al inicio</a>
        </div>
    </section>
</main>
</body>
</html>
